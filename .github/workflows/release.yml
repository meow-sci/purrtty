name: Build mod dist

# Tests run on all three supported OSes (the vendored native libghostty-vt
# binaries for win-x64 / linux-x64 / osx-arm64 are checked in, so each runner
# exercises its own native lib — RawCellLayout.Validate() and the PTY backends
# get real coverage per platform). One Linux job then builds the
# platform-agnostic mod dist (every build bundles all three native libs) and
# publishes a GitHub release:
#
#   push to main        → release    "purrTTY 1.<run number>.0" (keep newest 10)
#   push to feature/*   → prerelease "purrTTY 1.<run number>.0-beta"
#                         tags are v<version>; major is fixed at 1, patch at 0
#                         all feature branches share the 5 newest prereleases
#   any other ref (release/fix/chore branches, PRs into main)
#                       → build + tests only (no release, no version stamp)
#
# The KSA reference assemblies are licensed game files and live in the private
# repo meow-sci/ksa-game-assemblies (expected layout: the DLLs — KSA.dll,
# Brutal.*.dll, Planet.*.dll — under current/dll/ at the repo root). Access needs the
# KSA_GAME_ASSEMBLIES_PAT repo secret: a fine-grained PAT with read-only
# Contents access to that repo (same pattern as flexo).

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  checks: write    # test-reporter publishes results as a check run

# One in-flight build per ref; a newer push supersedes an older run.
concurrency:
  group: dist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Release config so the bits we test are the bits we ship; each OS loads its
  # own vendored native libghostty-vt (the Unix PTY tests self-skip on Windows).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Directory.Build.props resolves these before any per-OS defaults.
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
    steps:
      - name: Checkout purrtty
        uses: actions/checkout@v6

      - name: Checkout private KSA assemblies
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test
        id: test
        run: dotnet test purrtty.slnx -c Release --nologo -v quiet --logger trx --results-directory .tmp/test-results

      # GitHub's equivalent of GitLab's JUnit report ingestion: parses the TRX
      # files and publishes a check run on the commit with the per-test listing
      # and failure annotations. Runs on test failure too (that's when the
      # report matters most); skipped only if the Test step never ran.
      # Pinned to the v3 commit SHA (the action holds checks:write).
      - name: Report test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        with:
          name: test results (${{ matrix.os }})
          path: .tmp/test-results/*.trx
          reporter: dotnet-trx

      - name: Upload test results artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        with:
          name: test-results-${{ matrix.os }}
          path: .tmp/test-results

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      channel: ${{ steps.meta.outputs.channel }}
    env:
      KSA_DLL_DIR: ${{ github.workspace }}/.tmp/ksa-game-assemblies/current/dll
      PURRTTY_DIST_DIR: ${{ github.workspace }}/.tmp/dist
    steps:
      - name: Checkout purrtty
        uses: actions/checkout@v6

      - name: Checkout private KSA assemblies
        uses: actions/checkout@v6
        with:
          repository: meow-sci/ksa-game-assemblies
          path: .tmp/ksa-game-assemblies
          token: ${{ secrets.KSA_GAME_ASSEMBLIES_PAT }}
          persist-credentials: false
          ref: main

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release policy
        run: python3 scripts/check-release-policy.py

      # Branch names only select the channel; the validated workflow run number
      # determines the version. Later steps consume these values via env:.
      - name: Compute release metadata
        id: meta
        run: bash scripts/release-metadata.sh

      # The version users see in-game / in mod.toml matches the release.
      # MODVERSION contains only digits, dots, and an optional -beta suffix,
      # so it cannot contain the sed delimiter or replacement metacharacters.
      - name: Stamp mod version
        if: steps.meta.outputs.publish == 'true'
        env:
          MODVERSION: ${{ steps.meta.outputs.modversion }}
        run: |
          sed -i -E "s/^version = \".*\"/version = \"$MODVERSION\"/" purrTTY.GameMod/mod.toml
          grep '^version' purrTTY.GameMod/mod.toml

      # The GameMod build's CopyCustomContent target assembles the full mod
      # folder (DLLs, all native libs, themes, fonts, licenses) at
      # $PURRTTY_DIST_DIR/purrTTY/.
      - name: Build mod dist
        run: dotnet build purrTTY.GameMod -c Release --nologo -v quiet

      - name: Package
        if: steps.meta.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd "$PURRTTY_DIST_DIR"
          zip -r "purrTTY-$VERSION.zip" purrTTY
          unzip -l "purrTTY-$VERSION.zip"

      - name: Publish release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/publish-release.sh

  prune:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Cleanup is serialized per channel; beta branches share one retention pool.
    concurrency:
      group: rolling-release-cleanup-${{ needs.build.outputs.channel }}
      cancel-in-progress: false
    steps:
      - name: Checkout retention policy
        uses: actions/checkout@v6

      # Keep 10 stable releases (including the three legacy named releases) and
      # 5 beta releases. Fetch every page so retention is not capped at 200.
      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: |
          case "$CHANNEL" in
            main) KEEP=10 ;;
            feature) KEEP=5 ;;
            *) echo "Unknown release channel: $CHANNEL" >&2; exit 1 ;;
          esac
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | python3 scripts/release-retention.py --channel "$CHANNEL" --keep "$KEEP" \
            > "$RUNNER_TEMP/purrtty-stale-releases.txt"
          while IFS= read -r tag; do
            echo "Pruning $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/purrtty-stale-releases.txt"
